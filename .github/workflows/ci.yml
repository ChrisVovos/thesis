name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ItemAuthoring.slnx

      # Warnings are errors in this repository, so a clean build is a real gate rather than a
      # formality.
      - name: Build
        run: dotnet build ItemAuthoring.slnx --configuration Release --no-restore

      # The runner provides a container runtime, so the integration suite really runs here and the
      # coverage figure below reflects the whole backend rather than the unit-testable part of it.
      - name: Test
        run: >-
          dotnet test ItemAuthoring.slnx
          --configuration Release
          --no-build
          --settings coverlet.runsettings
          --logger "trx;LogFileName=test-results.trx"
          --results-directory artifacts/coverage

      - name: Enforce the coverage gate
        shell: pwsh
        run: ./scripts/report-coverage.ps1 -MinimumPercentage 80

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/coverage

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: client/coverage

  contracts:
    name: API contracts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      # The committed OpenAPI document and GraphQL schema are what the client generates from. If a
      # change to either surface is not reflected in them, the generated client is stale and this job
      # fails rather than letting the two drift apart silently.
      - name: Export the contracts
        run: dotnet run --project src/ItemAuthoring.Api -- --export-contracts artifacts
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Fail when the committed contracts are out of date
        run: git diff --exit-code -- artifacts/openapi.json artifacts/schema.graphql

      - name: Regenerate the typed clients
        working-directory: client
        run: |
          npm ci
          npm run codegen

      - name: Fail when the generated clients are out of date
        run: git diff --exit-code -- client/src/app/data-access

  end-to-end:
    name: End-to-end (both transports)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Write the stack configuration
        run: |
          {
            echo "MSSQL_SA_PASSWORD=${{ secrets.CI_SQL_PASSWORD || 'Ci-Local-Password-1!' }}"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "SEED_ADMIN_EMAIL=administrator@itemauthoring.local"
            echo "SEED_ADMIN_PASSWORD=Ci-Admin-Password-1!"
            echo "SEED_SAMPLE_ITEMS=200"
            echo "API_ENVIRONMENT=Benchmark"
          } > .env

      - name: Start the stack
        run: docker compose up --build --detach --wait

      - name: Install the browser
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the suite over both transports
        working-directory: client
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_EMAIL: administrator@itemauthoring.local
          E2E_PASSWORD: Ci-Admin-Password-1!

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
